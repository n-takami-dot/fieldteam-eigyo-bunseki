<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect width="192" height="192" rx="40" fill="#ffffff"/>
  <!-- store building body -->
  <rect x="18" y="100" width="100" height="74" rx="6" fill="#e8e8e8"/>
  <!-- store sign red -->
  <rect x="18" y="72" width="100" height="32" rx="4" fill="#e53935"/>
  <!-- store roof dark red -->
  <rect x="18" y="58" width="100" height="18" rx="4" fill="#c62828"/>
  <!-- windows -->
  <rect x="30" y="118" width="28" height="56" rx="3" fill="#90caf9"/>
  <rect x="70" y="118" width="28" height="38" rx="3" fill="#90caf9"/>
  <!-- tree -->
  <rect x="128" y="148" width="6" height="20" rx="2" fill="#8d6e63"/>
  <circle cx="131" cy="140" r="12" fill="#66bb6a"/>
  <!-- cart -->
  <path d="M8 155 l8-4 6 18 18 0" stroke="#757575" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="14" cy="175" r="3" fill="#757575"/>
  <circle cx="30" cy="175" r="3" fill="#757575"/>
  <!-- magnifier circle -->
  <circle cx="138" cy="80" r="46" fill="white" fill-opacity="0.95"/>
  <circle cx="138" cy="80" r="46" stroke="#424242" stroke-width="10" fill="none"/>
  <!-- bar chart inside magnifier -->
  <rect x="108" y="96" width="10" height="18" rx="2" fill="#e53935" opacity="0.4"/>
  <rect x="122" y="84" width="10" height="30" rx="2" fill="#e53935" opacity="0.7"/>
  <rect x="136" y="70" width="10" height="44" rx="2" fill="#e53935"/>
  <!-- pie chart inside magnifier -->
  <path d="M158 62 A16 16 0 0 1 174 78 L158 78 Z" fill="#e53935"/>
  <path d="M158 78 A16 16 0 0 1 145 90 L158 78 Z" fill="#ef9a9a"/>
  <path d="M158 78 A16 16 0 1 1 158 62 L158 78 Z" fill="#ffcdd2"/>
  <!-- magnifier handle -->
  <line x1="174" y1="116" x2="188" y2="132" stroke="#424242" stroke-width="10" stroke-linecap="round"/>
</svg>