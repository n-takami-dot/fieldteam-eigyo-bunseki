<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店舗マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#f7f6f2;--surface:#fff;--border:rgba(0,0,0,0.08);
  --text:#1a1a18;--sub:#6b6a64;--muted:#a09f98;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);}

header{
  background:var(--surface);border-bottom:1px solid var(--border);
  height:50px;display:flex;align-items:center;padding:0 16px;gap:10px;
  position:fixed;top:0;left:0;right:0;z-index:1000;
}
.h-title{font-size:14px;font-weight:700;}
.h-sub{font-size:11px;color:var(--sub);}
.h-badge{margin-left:auto;background:#f0ede4;border:1px solid var(--border);
  border-radius:6px;padding:2px 8px;font-size:11px;color:var(--sub);
  font-family:'DM Mono',monospace;white-space:nowrap;}
.back-link{font-size:11px;color:var(--muted);text-decoration:none;flex-shrink:0;}

.layout{display:flex;margin-top:50px;height:calc(100vh - 50px);}

/* サイドバー */
.sidebar{
  width:260px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);overflow-y:auto;
  padding:16px 12px;display:flex;flex-direction:column;gap:16px;
  z-index:500;
}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;
  color:var(--muted);margin-bottom:8px;text-transform:uppercase;}
.stat-box{background:#f7f6f2;border-radius:8px;padding:8px 10px;margin-bottom:6px;}
.stat-lbl{font-size:10px;color:var(--muted);margin-bottom:2px;}
.stat-val{font-size:18px;font-weight:700;font-family:'DM Mono',monospace;line-height:1;}
.stat-unit{font-size:10px;font-weight:400;color:var(--sub);margin-left:2px;}

/* フィルタータブ */
.filter-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:10px;}
.ftab{flex:1;padding:5px 4px;font-size:10px;font-weight:700;
  border:none;background:none;cursor:pointer;color:var(--muted);
  font-family:'Noto Sans JP',sans-serif;border-bottom:2px solid transparent;
  transition:color .12s,border-color .12s;white-space:nowrap;}
.ftab.active{color:var(--text);border-bottom:2px solid var(--text);}
.ftab-panel{display:none;}
.ftab-panel.active{display:block;}

.filter-btn{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;
  border-radius:6px;border:1px solid transparent;background:none;cursor:pointer;
  font-size:12px;font-family:'Noto Sans JP',sans-serif;color:var(--text);
  transition:background .12s;margin-bottom:2px;text-align:left;}
.filter-btn:hover{background:#f0ede4;}
.filter-btn.active{background:#f0ede4;border-color:var(--border);}
.filter-btn.active::before{content:'✓';font-size:10px;margin-right:2px;flex-shrink:0;}
.filter-btn:not(.active)::before{content:'';display:inline-block;width:14px;flex-shrink:0;}
.f-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.f-cnt{margin-left:auto;font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);}
.scroll-list{max-height:180px;overflow-y:auto;}
.scroll-list .filter-btn{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:flex;
  align-items:center;
}

/* 凡例 */
.legend-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11px;color:var(--sub);}
.legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,0.8);}

/* マップ */
#map{flex:1;}

/* ポップアップ カスタム */
.leaflet-popup-content-wrapper{
  border-radius:10px;padding:0;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);
  font-family:'Noto Sans JP',sans-serif;
}
.leaflet-popup-content{margin:0;min-width:200px;}
.popup-inner{padding:12px 14px;}
.popup-name{font-size:13px;font-weight:700;margin-bottom:2px;color:#1a1a18;}
.popup-chain{font-size:11px;color:#6b6a64;margin-bottom:8px;}
.popup-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:3px;}
.popup-key{color:#a09f98;}
.popup-val{font-weight:500;font-family:'DM Mono',monospace;}
.popup-pills{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px;}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;}
.popup-addr{font-size:10px;color:#a09f98;margin-top:7px;line-height:1.5;border-top:1px solid rgba(0,0,0,0.06);padding-top:6px;}
.popup-gmaps{display:block;margin-top:8px;text-align:center;font-size:11px;
  background:#f7f6f2;border-radius:6px;padding:5px;color:#2b7fd4;
  text-decoration:none;border:1px solid rgba(0,0,0,0.08);}
.popup-gmaps:hover{background:#e6f1fb;}

/* シート切り替えボタン */
.sheet-btn{font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid var(--border);
  background:none;color:var(--sub);cursor:pointer;font-family:'Noto Sans JP',sans-serif;
  transition:background .12s,color .12s,border-color .12s;white-space:nowrap;}
.sheet-btn.active{background:#1a9968;color:#fff;border-color:#1a9968;}
.sheet-btn:hover:not(.active){background:#f0ede4;}

/* ラベルツールチップ */
.store-label{
  background:rgba(255,255,255,0.92);
  border:1px solid rgba(0,0,0,0.12);
  border-radius:4px;
  padding:2px 6px;
  font-size:10px;
  font-family:'Noto Sans JP',sans-serif;
  font-weight:500;
  color:#1a1a18;
  white-space:nowrap;
  box-shadow:0 1px 4px rgba(0,0,0,0.12);
  pointer-events:none;
}
.store-label::before{ display:none; }

/* リセットボタン */
#reset-btn{font-size:10px;padding:2px 8px;border-radius:5px;
  border:1px solid var(--border);background:#f7f6f2;color:var(--muted);
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;display:none;}

/* モバイル */
@media(max-width:767px){
  .sidebar{display:none;}
  #mob-filter-btn{
    position:fixed;bottom:20px;right:16px;z-index:1000;
    background:var(--surface);border:1px solid var(--border);
    border-radius:50px;padding:8px 16px;font-size:13px;
    font-family:'Noto Sans JP',sans-serif;cursor:pointer;
    color:var(--text);box-shadow:0 2px 12px rgba(0,0,0,0.15);
  }
  #mob-filter-panel{
    position:fixed;bottom:70px;right:16px;z-index:1000;
    background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:12px;width:220px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);display:none;
    max-height:60vh;overflow-y:auto;
  }
  #mob-filter-panel.open{display:block;}
}
@media(min-width:768px){
  #mob-filter-btn,#mob-filter-panel{display:none!important;}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="h-title">店舗マップ</div>
  </div>
  <div class="h-sub">担当者別カラー表示</div>
  <span class="h-badge" id="count-badge">114店舗</span>
  <div id="sheet-switcher" style="display:flex;gap:4px;flex-shrink:0;">
    <button class="sheet-btn active" data-sheet="current" onclick="switchSheet('current')">現行</button>
    <button class="sheet-btn" data-sheet="plan2026" onclick="switchSheet('plan2026')">2026年7月案</button>
    <button class="sheet-btn" data-sheet="plan2027" onclick="switchSheet('plan2027')">2027年度案</button>
  </div>
  <a href="https://docs.google.com/spreadsheets/d/1tu6Mw42ZtemBEUluYBPNLNmQdLHnMsY-_X8w8s613XQ/edit" target="_blank" style="
    font-size:11px;padding:3px 9px;border-radius:6px;
    border:1px solid var(--border);background:#f0ede4;
    color:var(--sub);text-decoration:none;white-space:nowrap;flex-shrink:0;
  ">📋 シートを開く</a>
  <span id="loading-badge" style="font-size:11px;color:var(--muted);display:none;flex-shrink:0;">読込中...</span>
  <button id="label-toggle-btn" onclick="toggleLabels()" style="
    font-size:11px;padding:3px 10px;border-radius:6px;
    border:1px solid var(--border);background:#f0ede4;
    color:var(--sub);cursor:pointer;font-family:'Noto Sans JP',sans-serif;
    white-space:nowrap;flex-shrink:0;transition:background .12s,color .12s;
  ">🏷 ラベル OFF</button>
  <a class="back-link" href="index.html">← 一覧</a>
</header>

<div class="layout">
  <aside class="sidebar">
    <div>
      <div class="sec-lbl">統計</div>
      <div class="stat-box">
        <div class="stat-lbl">表示中店舗数</div>
        <div class="stat-val" id="stat-count">114<span class="stat-unit">店</span></div>
      </div>
    </div>
    <div>
      <div class="sec-lbl">担当者カラー</div>
      <div id="staff-legend"></div>
    </div>
    <div>
      <div style="display:flex;align-items:center;margin-bottom:0;">
        <div class="sec-lbl" style="margin-bottom:0;flex:1;">フィルター</div>
        <button id="reset-btn" onclick="resetAllFilters()">✕ クリア</button>
      </div>
      <div style="margin-top:10px;">
        <div class="filter-tabs" id="pc-tabs">
          <button class="ftab active" data-tab="pc-tab-staff">担当者</button>
          <button class="ftab" data-tab="pc-tab-pri">優先度</button>
          <button class="ftab" data-tab="pc-tab-loc">立地</button>
          <button class="ftab" data-tab="pc-tab-chain">チェーン</button>
        </div>
        <div id="pc-tab-staff" class="ftab-panel active"></div>
        <div id="pc-tab-pri" class="ftab-panel"></div>
        <div id="pc-tab-loc" class="ftab-panel"></div>
        <div id="pc-tab-chain" class="ftab-panel scroll-list"></div>
      </div>
    </div>
  </aside>

  <div id="map"></div>
</div>

<!-- モバイル用フィルター -->
<button id="mob-filter-btn" onclick="toggleMobFilter()">⚙ フィルター</button>
<div id="mob-filter-panel">
  <div style="display:flex;align-items:center;margin-bottom:8px;">
    <span style="font-size:11px;font-weight:700;flex:1;">フィルター</span>
    <button id="mob-reset-btn" onclick="resetAllFilters()" style="font-size:10px;padding:2px 8px;border-radius:5px;border:1px solid var(--border);background:#f7f6f2;color:var(--muted);cursor:pointer;display:none;">✕ クリア</button>
  </div>
  <div class="filter-tabs" id="mob-tabs">
    <button class="ftab active" data-tab="mob-tab-staff">担当者</button>
    <button class="ftab" data-tab="mob-tab-pri">優先度</button>
    <button class="ftab" data-tab="mob-tab-loc">立地</button>
    <button class="ftab" data-tab="mob-tab-chain">チェーン</button>
  </div>
  <div id="mob-tab-staff" class="ftab-panel active"></div>
  <div id="mob-tab-pri" class="ftab-panel"></div>
  <div id="mob-tab-loc" class="ftab-panel"></div>
  <div id="mob-tab-chain" class="ftab-panel scroll-list" style="max-height:120px;overflow-y:auto;"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwYUwa78Wqpp7lWcWsurxFOJvCOQrQm0spIMS_Xry3UbvvLc-XdyZQ02YTNnQQ4tAw/exec";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1tu6Mw42ZtemBEUluYBPNLNmQdLHnMsY-_X8w8s613XQ/edit";
let stores = [];

const STAFF_CFG = {
  "大石 佐輝子": {color:"#e53935", light:"#fef0f0"},
  "三木 敬子":   {color:"#1a9968", light:"#e1f5ee"},
  "垂井 明美":   {color:"#2b7fd4", light:"#e6f1fb"},
  "増田 直美":   {color:"#d4870f", light:"#faeeda"},
  "松尾 奈緒美": {color:"#8e44ad", light:"#f5eef8"},
  "馬込 和也":   {color:"#c44a20", light:"#faece7"},
};
const LOC_CFG = {
  "商業施設内":{color:"#6c63d4",bg:"#eeedfe",tc:"#3c3489"},
  "ロードサイド":{color:"#1a9968",bg:"#e1f5ee",tc:"#085041"},
  "住宅地":{color:"#2b7fd4",bg:"#e6f1fb",tc:"#0c447c"},
  "駅前":{color:"#d4870f",bg:"#faeeda",tc:"#633806"},
};
const PRI_CFG = {
  "第1優先":{bg:"#fef0f0",tc:"#b81c1c"},
  "第2優先":{bg:"#fff8e1",tc:"#a06000"},
  "第3優先":{bg:"#f1f8e9",tc:"#387027"},
};

const filters = {staff:new Set(),pri:new Set(),loc:new Set(),chain:new Set()};
let markerMap = {};

// 地図初期化（兵庫県中心）
const map = L.map("map", {zoomControl:true}).setView([34.82, 134.95], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom:19
}).addTo(map);

function isVisible(s){
  if(filters.staff.size>0 && !filters.staff.has(s.a)) return false;
  if(filters.pri.size>0   && !filters.pri.has(s.p))   return false;
  if(filters.loc.size>0   && !filters.loc.has(s.l))   return false;
  if(filters.chain.size>0 && !filters.chain.has(s.c)) return false;
  return true;
}

function makeIcon(color, size=10){
  return L.divIcon({
    className:"",
    html:`<div style="
      width:${size*2}px;height:${size*2}px;
      background:${color};border-radius:50%;
      border:2.5px solid #fff;
      box-shadow:0 1px 5px rgba(0,0,0,0.3);
    "></div>`,
    iconSize:[size*2, size*2],
    iconAnchor:[size, size],
    popupAnchor:[0, -size-4]
  });
}

function buildPopup(s){
  const sc = STAFF_CFG[s.a] || {color:"#999",light:"#eee"};
  const lc = LOC_CFG[s.l]   || {bg:"#eee",tc:"#333"};
  const pc = PRI_CFG[s.p]   || {bg:"#eee",tc:"#333"};
  const gmUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.n + ' ' + s.addr)}`;
  return `<div class="popup-inner">
    <div class="popup-name">${s.n}</div>
    <div class="popup-chain">${s.c}</div>
    <div class="popup-row"><span class="popup-key">担当者</span><span style="font-weight:500;font-size:12px;">${s.a}</span></div>
    <div class="popup-row"><span class="popup-key">ランク</span><span class="popup-val">${s.r}</span></div>
    <div class="popup-row"><span class="popup-key">裁量</span><span class="popup-val">${s.d}</span></div>
    <div class="popup-row"><span class="popup-key">月平均</span><span class="popup-val">${s.m.toFixed(1)}万円</span></div>
    <div class="popup-pills">
      <span class="pill" style="background:${lc.bg};color:${lc.tc};">${s.l}</span>
      <span class="pill" style="background:${pc.bg};color:${pc.tc};">${s.p}</span>
      ${s.pair==='〇'?'<span class="pill" style="background:#f3f0ff;color:#5c4fcf;">ペア店舗</span>':''}
    </div>
    <div class="popup-addr">${s.addr}</div>
    <a class="popup-gmaps" href="${gmUrl}" target="_blank">📍 Google マップで開く</a>
  </div>`;
}

// マーカー生成
let labelVisible = false;

stores.forEach(s=>{
  const sc = STAFF_CFG[s.a] || {color:"#999"};
  const marker = L.marker([s.lat, s.lng], {icon: makeIcon(sc.color)})
    .bindPopup(buildPopup(s), {maxWidth:260, minWidth:220})
    .bindTooltip(s.n, {
      permanent: false,
      direction: "top",
      offset: [0, -12],
      className: "store-label"
    });
  markerMap[s.n] = {marker, store:s};
  marker.addTo(map);
});

function toggleLabels(){
  labelVisible = !labelVisible;
  const btn = document.getElementById("label-toggle-btn");
  btn.textContent = labelVisible ? "🏷 ラベル ON" : "🏷 ラベル OFF";
  btn.style.background = labelVisible ? "#1a9968" : "#f0ede4";
  btn.style.color = labelVisible ? "#fff" : "var(--sub)";
  btn.style.borderColor = labelVisible ? "#1a9968" : "var(--border)";
  Object.values(markerMap).forEach(({marker})=>{
    marker.setTooltipContent(marker.getTooltip().getContent());
    if(labelVisible){
      marker.openTooltip();
    } else {
      marker.closeTooltip();
    }
  });
}

function updateMarkers(){
  let count = 0;
  Object.values(markerMap).forEach(({marker, store})=>{
    const vis = isVisible(store);
    if(vis){
      marker.addTo(map);
      if(labelVisible) marker.openTooltip();
      else marker.closeTooltip();
      count++;
    } else {
      marker.remove();
    }
  });
  document.getElementById("stat-count").innerHTML = `${count}<span class="stat-unit">店</span>`;
  document.getElementById("count-badge").textContent = `${count}店舗`;
  updateResetBtn();
}

// 担当者カラー凡例
function buildLegend(){
  const wrap = document.getElementById("staff-legend");
  Object.entries(STAFF_CFG).forEach(([name, cfg])=>{
    const cnt = stores.filter(s=>s.a===name).length;
    const row = document.createElement("div");
    row.className = "legend-row";
    row.innerHTML = `<span class="legend-dot" style="background:${cfg.color};"></span>${name}<span style="margin-left:auto;font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);">${cnt}</span>`;
    wrap.appendChild(row);
  });
}

// フィルターボタン
function buildFilterBtn(label, filterKey, dataKey, value, colorDot, containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const cnt = stores.filter(s=>s[dataKey]===value).length;
  const btn = document.createElement("button");
  btn.className="filter-btn";
  btn.dataset.key=filterKey;
  btn.dataset.val=value;
  let dotHtml = colorDot ? `<span class="f-dot" style="background:${colorDot}"></span>` : "";
  btn.innerHTML = `${dotHtml}${label}<span class="f-cnt">${cnt}</span>`;
  btn.addEventListener("click",()=>{
    const f = filters[filterKey];
    if(f.has(value)){f.delete(value);btn.classList.remove("active");}
    else{f.add(value);btn.classList.add("active");}
    document.querySelectorAll(`.filter-btn[data-key="${filterKey}"][data-val="${value}"]`)
      .forEach(b=>b.classList.toggle("active", f.has(value)));
    updateMarkers();
  });
  wrap.appendChild(btn);
}

function buildFilters(suffix){
  Object.entries(STAFF_CFG).forEach(([a,cfg])=>
    buildFilterBtn(a,"staff","a",a,cfg.color,`${suffix}-tab-staff`));
  Object.keys(PRI_CFG).forEach(p=>
    buildFilterBtn(p,"pri","p",p,null,`${suffix}-tab-pri`));
  Object.keys(LOC_CFG).forEach(l=>
    buildFilterBtn(l,"loc","l",l,LOC_CFG[l].color,`${suffix}-tab-loc`));
  [...new Set(stores.map(s=>s.c))].sort().forEach(c=>
    buildFilterBtn(c,"chain","c",c,null,`${suffix}-tab-chain`));
}

function setupTabs(tabsId){
  const wrap = document.getElementById(tabsId);
  wrap.querySelectorAll("[data-tab]").forEach(tab=>{
    tab.addEventListener("click",()=>{
      wrap.querySelectorAll("[data-tab]").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      wrap.parentElement.querySelectorAll(".ftab-panel").forEach(p=>{
        p.classList.toggle("active", p.id===tab.dataset.tab);
      });
    });
  });
}

function hasActiveFilter(){
  return Object.values(filters).some(f=>f.size>0);
}
function updateResetBtn(){
  const show = hasActiveFilter();
  ["reset-btn","mob-reset-btn"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display=show?"inline-block":"none";
  });
}
function resetAllFilters(){
  Object.keys(filters).forEach(k=>filters[k].clear());
  document.querySelectorAll(".filter-btn.active").forEach(b=>b.classList.remove("active"));
  updateMarkers();
}
function toggleMobFilter(){
  document.getElementById("mob-filter-panel").classList.toggle("open");
}

let currentSheet = "current";

async function loadData(sheetKey){
  document.getElementById("loading-badge").style.display="";
  document.getElementById("count-badge").textContent="読込中...";

  // 既存のJSONPスクリプトタグを削除
  const old = document.getElementById("jsonp-script");
  if(old) old.remove();

  // タイムアウト処理
  const timeoutId = setTimeout(()=>{
    document.getElementById("count-badge").textContent="読込エラー";
    document.getElementById("loading-badge").style.display="none";
  }, 10000);

  // グローバルコールバック関数を定義
  window.__dashboardCallback = function(json){
    clearTimeout(timeoutId);
    document.getElementById("loading-badge").style.display="none";
    if(json.error){
      document.getElementById("count-badge").textContent="読込エラー";
      console.error(json.error);
      return;
    }
    stores = json.stores;
    currentSheet = sheetKey;
    // 既存マーカー削除
    Object.values(markerMap).forEach(({marker})=>marker.remove());
    markerMap = {};
    document.getElementById("staff-legend").innerHTML="";
    ["pc-tab-staff","pc-tab-pri","pc-tab-loc","pc-tab-chain",
     "mob-tab-staff","mob-tab-pri","mob-tab-loc","mob-tab-chain"].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.innerHTML="";
    });
    Object.keys(filters).forEach(k=>filters[k].clear());
    stores.forEach(s=>{
      if(!s.lat||!s.lng) return;
      const sc=STAFF_CFG[s.a]||{color:"#999"};
      const marker=L.marker([s.lat,s.lng],{icon:makeIcon(sc.color)})
        .bindPopup(buildPopup(s),{maxWidth:260,minWidth:220})
        .bindTooltip(s.n,{permanent:false,direction:"top",offset:[0,-12],className:"store-label"});
      markerMap[s.n]={marker,store:s};
      marker.addTo(map);
    });
    buildLegend();
    buildFilters("pc");
    buildFilters("mob");
    setupTabs("pc-tabs");
    setupTabs("mob-tabs");
    updateMarkers();
  };

  const script = document.createElement("script");
  script.id = "jsonp-script";
  script.src = `${API_URL}?sheet=${sheetKey}&callback=__dashboardCallback`;
  document.head.appendChild(script);
}

function switchSheet(sheetKey){
  if(sheetKey===currentSheet) return;
  document.querySelectorAll(".sheet-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.sheet===sheetKey);
  });
  loadData(sheetKey);
}

buildLegend();
buildFilters("pc");
buildFilters("mob");
setupTabs("pc-tabs");
setupTabs("mob-tabs");
loadData("current");
</script>
</body>
</html>
