<meta charset="UTF-8">

<title>店舗散布図 — 月平均金額</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#f7f6f2; --surface:#fff; --border:rgba(0,0,0,0.08);
  --text:#1a1a18; --sub:#6b6a64; --muted:#a09f98;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);}

/* ===== HEADER ===== */
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  height:50px;display:flex;align-items:center;padding:0 16px;gap:10px;
  position:fixed;top:0;left:0;right:0;z-index:100;
}
.h-title{font-size:14px;font-weight:700;}
.h-sub{font-size:11px;color:var(--sub);}
.h-badge{margin-left:auto;background:#f0ede4;border:1px solid var(--border);
  border-radius:6px;padding:2px 8px;font-size:11px;color:var(--sub);
  font-family:'DM Mono',monospace;white-space:nowrap;}
.back-link{font-size:11px;color:var(--muted);text-decoration:none;flex-shrink:0;}

/* ===== LAYOUT ===== */
.layout{
  display:flex;margin-top:50px;height:calc(100vh - 50px);overflow:hidden;
}

/* ===== SIDEBAR (PC) ===== */
.sidebar{
  width:220px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);overflow-y:auto;
  padding:16px 12px;display:flex;flex-direction:column;gap:18px;
}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.stat-box{background:#f7f6f2;border-radius:8px;padding:8px 10px;margin-bottom:6px;}
.stat-lbl{font-size:10px;color:var(--muted);margin-bottom:2px;}
.stat-val{font-size:18px;font-weight:700;font-family:'DM Mono',monospace;line-height:1;}
.stat-unit{font-size:10px;font-weight:400;color:var(--sub);margin-left:2px;}

/* ===== FILTER TABS ===== */
.filter-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:10px;}
.ftab{flex:1;padding:5px 4px;font-size:10px;font-weight:700;letter-spacing:.05em;
  border:none;background:none;cursor:pointer;color:var(--muted);
  font-family:'Noto Sans JP',sans-serif;border-bottom:2px solid transparent;
  transition:color .12s,border-color .12s;white-space:nowrap;}
.ftab.active{color:var(--text);border-bottom:2px solid var(--text);}
.ftab-panel{display:none;}
.ftab-panel.active{display:block;}

/* ===== FILTER BUTTONS ===== */
.filter-btn{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;
  border-radius:6px;border:1px solid transparent;background:none;cursor:pointer;
  font-size:12px;font-family:'Noto Sans JP',sans-serif;color:var(--text);
  transition:background .12s,border-color .12s;margin-bottom:2px;text-align:left;}
.filter-btn:hover{background:#f0ede4;}
.filter-btn.active{background:#f0ede4;border-color:var(--border);}
.filter-btn.active::before{content:'✓';font-size:10px;color:var(--text);margin-right:2px;flex-shrink:0;}
.filter-btn:not(.active)::before{content:'';display:inline-block;width:14px;flex-shrink:0;}
.f-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.f-cnt{margin-left:auto;font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);}

/* チェーン・担当者スクロールエリア */
.scroll-list{max-height:200px;overflow-y:auto;}

/* 凡例 */
.zone-row{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:11px;color:var(--sub);}
.zone-sw{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

/* ===== CHART AREA ===== */
.chart-area{
  flex:1;display:flex;flex-direction:column;
  padding:12px 16px 10px;overflow:hidden;min-width:0;
}
.chart-wrap{flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;position:relative;overflow:hidden;min-height:0;}
#chart-svg{width:100%;height:100%;display:block;}
#detail-bar{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:8px 14px;font-size:12px;display:none;flex-shrink:0;
  margin-top:8px;line-height:1.7;
}

/* ===== TOOLTIP ===== */
.tip{
  position:fixed;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.7;
  pointer-events:none;display:none;z-index:200;
  box-shadow:0 4px 20px rgba(0,0,0,.12);min-width:200px;max-width:260px;
}
.tip-name{font-size:13px;font-weight:700;margin-bottom:2px;}
.tip-chain{color:var(--sub);margin-bottom:5px;font-size:11px;}
.tip-row{display:flex;justify-content:space-between;gap:12px;}
.tip-key{color:var(--muted);}
.tip-val{font-weight:500;font-family:'DM Mono',monospace;}
.loc-pill{display:inline-block;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:500;margin-top:4px;}
.pri-pill{display:inline-block;padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:500;margin-top:2px;margin-left:4px;}
.dot{cursor:pointer;transition:opacity .12s;}
.dot:hover{opacity:1!important;}

/* ===== MOBILE FILTER BAR ===== */
#mob-filter-btn{display:none;}
#mob-filter-panel{display:none;}

/* ===== ROTATE NOTICE ===== */
#rotate-notice{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(20,20,18,0.93);
  flex-direction:column;align-items:center;justify-content:center;
  gap:18px;color:#fff;text-align:center;padding:32px;
}
#rotate-notice p{font-size:15px;line-height:1.8;}
#rotate-icon{animation:rot 2s ease-in-out infinite;}
@keyframes rot{0%,100%{transform:rotate(0deg)}40%,60%{transform:rotate(90deg)}}

/* ===== MOBILE PORTRAIT: show rotate notice ===== */
@media (max-width:767px) and (orientation:portrait){
  #rotate-notice{display:flex;}
}

/* ===== MOBILE LANDSCAPE ===== */
@media (max-width:900px) and (orientation:landscape){
  header{height:40px;padding:0 10px;}
  .h-title{font-size:12px;}
  .h-sub{display:none;}
  .layout{margin-top:40px;height:calc(100vh - 40px);}
  .sidebar{display:none;}
  .chart-area{padding:6px 8px 6px;}
  #detail-bar{font-size:11px;padding:5px 10px;margin-top:4px;}

  #mob-filter-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:7px;padding:4px 12px;font-size:12px;
    font-family:'Noto Sans JP',sans-serif;cursor:pointer;
    color:var(--text);margin-bottom:5px;flex-shrink:0;
  }
  #mob-filter-panel{
    background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;margin-bottom:5px;flex-shrink:0;
    flex-direction:column;gap:6px;
  }
  #mob-filter-panel.open{display:flex;}
  .mob-filter-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .mob-ftab{flex:1;padding:4px 2px;font-size:10px;font-weight:700;
    border:none;background:none;cursor:pointer;color:var(--muted);
    font-family:'Noto Sans JP',sans-serif;border-bottom:2px solid transparent;
    white-space:nowrap;}
  .mob-ftab.active{color:var(--text);border-bottom:2px solid var(--text);}
  .mob-ftab-panel{display:none;flex-wrap:wrap;gap:4px;}
  .mob-ftab-panel.active{display:flex;}
  .mob-ftab-panel .filter-btn{padding:3px 7px;font-size:11px;width:auto;}
  .mob-ftab-panel .scroll-list{max-height:80px;}
}
</style>

const DISC_IDX={強:0,中:1,弱:2};
const Y_MAX=160;

// フィルター状態（Set = 選択中、空Set = 全選択扱い）
const filters = {
  pri: new Set(),   // 空=全て表示
  loc: new Set(),
  staff: new Set(),
  chain: new Set(),
};

const svgEl=document.getElementById("chart-svg");
const tipEl=document.getElementById("tooltip");
const detEl=document.getElementById("detail-bar");

function isVisible(s){
  if(filters.pri.size>0  && !filters.pri.has(s.p))  return false;
  if(filters.loc.size>0  && !filters.loc.has(s.l))  return false;
  if(filters.staff.size>0 && !filters.staff.has(s.a)) return false;
  if(filters.chain.size>0 && !filters.chain.has(s.c)) return false;
  return true;
}

function dims(){
  const w=document.getElementById("chart-wrap");
  return {W:w.clientWidth,H:w.clientHeight};
}

function draw(){
  const {W,H}=dims();
  const mob=window.innerWidth<=900;
  const ML=mob?52:68, MR=mob?10:24, MT=mob?14:18, MB=mob?36:44;
  const PW=W-ML-MR, PH=H-MT-MB;
  const ns="http://www.w3.org/2000/svg";
  svgEl.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svgEl.innerHTML="";

  const mk=(tag,a,t)=>{
    const e=document.createElementNS(ns,tag);
    Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));
    if(t!=null)e.textContent=t;return e;
  };
  const cx=(d,j)=>ML+(DISC_IDX[d]+0.5)*(PW/3)+j;
  const cy=(v)=>MT+PH-Math.min(v/Y_MAX,1)*PH;
  const fs=mob?9:11;

  // Zones
  ZONES.forEach(([lo,hi,fill,stroke,label])=>{
    const y1=cy(hi),y2=cy(lo);
    svgEl.appendChild(mk("rect",{x:ML,y:y1,width:PW,height:y2-y1,fill,rx:0}));
    svgEl.appendChild(mk("line",{x1:ML,y1:y1,x2:W-MR,y2:y1,stroke,"stroke-width":"0.8","stroke-dasharray":"4 3"}));
    if(hi<=Y_MAX){
      svgEl.appendChild(mk("text",{
        x:W-MR-3,y:y1+fs+1,
        fill:stroke.replace(/[\d.]+\)$/,"0.8)"),
        "font-size":fs,"text-anchor":"end",
        "font-family":"'Noto Sans JP',sans-serif"
      },label));
    }
  });

  // Grid
  [0,20,40,60,80,100,120,140,160].forEach(v=>{
    const y=cy(v);
    svgEl.appendChild(mk("line",{x1:ML,y1:y,x2:W-MR,y2:y,stroke:"rgba(0,0,0,0.06)","stroke-width":"0.5"}));
    svgEl.appendChild(mk("text",{x:ML-5,y,fill:"#a09f98","font-size":fs,
      "text-anchor":"end","dominant-baseline":"central",
      "font-family":"'DM Mono',monospace"},v));
  });

  // Disc labels
  ["強","中","弱"].forEach(d=>{
    const x=ML+(DISC_IDX[d]+0.5)*(PW/3);
    svgEl.appendChild(mk("line",{x1:x,y1:MT,x2:x,y2:H-MB,stroke:"rgba(0,0,0,0.08)","stroke-width":"0.5"}));
    svgEl.appendChild(mk("text",{x,y:H-MB+(mob?14:18),fill:"#6b6a64",
      "font-size":mob?12:13,"text-anchor":"middle",
      "font-family":"'Noto Sans JP',sans-serif","font-weight":"500"},d));
  });

  svgEl.appendChild(mk("line",{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:"#c8c6be","stroke-width":"1"}));
  svgEl.appendChild(mk("line",{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:"#c8c6be","stroke-width":"1"}));
  svgEl.appendChild(mk("text",{
    x:mob?10:14,y:(MT+H-MB)/2,fill:"#6b6a64","font-size":mob?9:11,
    "text-anchor":"middle","font-family":"'Noto Sans JP',sans-serif",
    transform:`rotate(-90,${mob?10:14},${(MT+H-MB)/2})`
  },"月平均金額（万円）"));

  // Dots
  const buckets={強:[],中:[],弱:[]};
  stores.forEach(s=>buckets[s.d].push(s));
  const dotR=mob?8:7;

  Object.entries(buckets).forEach(([d,list])=>{
    list.forEach((s,i)=>{
      const p=LOC_CFG[s.l]||{color:"#999",bg:"#eee",tc:"#333"};
      const pc=PRI_CFG[s.p]||{bg:"#eee",tc:"#333"};
      const total=list.length;
      const spread=Math.min(PW/3*0.7,(total-1)*(mob?5:7));
      const jitter=total>1?-spread/2+(i/(total-1))*spread:0;
      const vis=isVisible(s);
      const x=cx(d,jitter),y=cy(s.m);

      const c=document.createElementNS(ns,"circle");
      c.setAttribute("class","dot");
      c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",dotR);
      c.setAttribute("fill",p.color);
      c.setAttribute("stroke","#fff");c.setAttribute("stroke-width","1.5");
      c.setAttribute("opacity",vis?"0.88":"0.05");

      const pairTxt = s.pair==='〇' ? '　<span style="font-size:10px;color:#888;">ペア店舗</span>' : '';

      const showTip=(ex,ey)=>{
        tipEl.style.display="block";
        tipEl.innerHTML=`<div class="tip-name">${s.n}</div>
          <div class="tip-chain">${s.c}</div>
          <div class="tip-row"><span class="tip-key">ランク</span><span class="tip-val">${s.r}</span></div>
          <div class="tip-row"><span class="tip-key">裁量</span><span class="tip-val">${s.d}</span></div>
          <div class="tip-row"><span class="tip-key">月平均</span><span class="tip-val">${s.m.toFixed(1)}万円</span></div>
          <div class="tip-row"><span class="tip-key">担当者</span><span class="tip-val" style="font-family:'Noto Sans JP',sans-serif;">${s.a}</span></div>
          <div style="margin-top:5px;">
            <span class="loc-pill" style="background:${p.bg};color:${p.tc};">${s.l}</span>
            <span class="pri-pill" style="background:${pc.bg};color:${pc.tc};">${s.p}</span>
            ${s.pair==='〇'?'<span class="pri-pill" style="background:#f3f0ff;color:#5c4fcf;">ペア店舗</span>':''}
          </div>`;
        tipEl.style.left=(ex>window.innerWidth-280?ex-268:ex+14)+"px";
        tipEl.style.top=(ey-10)+"px";
      };

      c.addEventListener("mouseenter",e=>{if(!vis)return;showTip(e.clientX,e.clientY);});
      c.addEventListener("mousemove",e=>{if(!vis)return;showTip(e.clientX,e.clientY);});
      c.addEventListener("mouseleave",()=>tipEl.style.display="none");

      c.addEventListener("click",e=>{
        if(!vis)return;
        e.stopPropagation();
        tipEl.style.display="none";
        detEl.style.display="block";
        detEl.innerHTML=`<strong>${s.n}</strong>　<span style="color:var(--sub)">${s.c}</span>　
          ランク：<strong>${s.r}</strong>　裁量：<strong>${s.d}</strong>　
          月平均：<strong style="font-family:'DM Mono',monospace">${s.m.toFixed(1)}万円</strong>　
          担当者：<strong>${s.a}</strong>　
          <span class="loc-pill" style="background:${p.bg};color:${p.tc};padding:2px 8px;border-radius:20px;font-size:11px;">${s.l}</span>
          <span class="pri-pill" style="background:${pc.bg};color:${pc.tc};padding:2px 8px;border-radius:20px;font-size:10px;">${s.p}</span>
          ${s.pair==='〇'?'<span class="pri-pill" style="background:#f3f0ff;color:#5c4fcf;padding:2px 8px;border-radius:20px;font-size:10px;">ペア店舗</span>':''}`;
      });
      svgEl.appendChild(c);
    });
  });

  updateStats();
}

document.getElementById("chart-wrap").addEventListener("click",e=>{
  if(e.target===e.currentTarget||e.target.tagName==="svg"||e.target.tagName==="rect"||e.target.tagName==="line"||e.target.tagName==="text"){
    document.getElementById("detail-bar").style.display="none";
  }
});

function updateStats(){
  const vis=stores.filter(s=>isVisible(s));
  document.getElementById("stat-count").innerHTML=`${vis.length}<span class="stat-unit">店</span>`;
  const sum=vis.reduce((a,s)=>a+s.m,0);
  document.getElementById("stat-sum").innerHTML=`${Math.round(sum).toLocaleString()}<span class="stat-unit">万円</span>`;
  document.getElementById("count-badge").textContent=`${vis.length}店舗`;
}

// ===== フィルターボタン構築 =====

function hasActiveFilter(){
  return filters.pri.size>0||filters.loc.size>0||filters.staff.size>0||filters.chain.size>0;
}

function updateResetBtn(){
  const show = hasActiveFilter();
  ['reset-btn','mob-reset-btn'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display=show?'':'none';
  });
}

function resetAllFilters(){
  ['pri','loc','staff','chain'].forEach(k=>filters[k].clear());
  document.querySelectorAll('.filter-btn.active').forEach(b=>b.classList.remove('active'));
  updateResetBtn();
  draw();
}

function buildFilterBtn(label, filterKey, value, colorDot, containerId){
  const wrap = document.getElementById(containerId);
  const cnt = stores.filter(s=>s[filterKey]===value).length;
  if(!wrap) return;
  const btn = document.createElement("button");
  btn.className = "filter-btn";
  btn.dataset.key = filterKey;
  btn.dataset.val = value;

  let dotHtml = "";
  if(colorDot) dotHtml = `<span class="f-dot" style="background:${colorDot}"></span>`;

  btn.innerHTML = `${dotHtml}${label}<span class="f-cnt">${cnt}</span>`;

  btn.addEventListener("click", ()=>{
    const f = filters[filterKey];
    if(f.has(value)){ f.delete(value); btn.classList.remove("active"); }
    else { f.add(value); btn.classList.add("active"); }
    // 両方のパネル同期
    syncBtnState(filterKey, value, f.has(value));
    updateResetBtn();
    draw();
  });
  wrap.appendChild(btn);
}

function syncBtnState(filterKey, value, active){
  document.querySelectorAll(`.filter-btn[data-key="${filterKey}"][data-val="${value}"]`).forEach(b=>{
    b.classList.toggle("active", active);
  });
}

function buildFilters(suffix){
  // 優先度
  Object.keys(PRI_CFG).forEach(p=>{
    buildFilterBtn(p, "pri", p, PRI_CFG[p].dot, `${suffix}-tab-pri`);
  });
  // 立地条件
  Object.keys(LOC_CFG).forEach(l=>{
    buildFilterBtn(l, "loc", l, LOC_CFG[l].color, `${suffix}-tab-loc`);
  });
  // 担当者
  [...new Set(stores.map(s=>s.a))].sort().forEach(a=>{
    buildFilterBtn(a, "staff", a, null, `${suffix}-tab-staff`);
  });
  // チェーン
  [...new Set(stores.map(s=>s.c))].sort().forEach(c=>{
    buildFilterBtn(c, "chain", c, null, `${suffix}-tab-chain`);
  });
}

// タブ切り替え
function setupTabs(tabsId, panelSelector){
  const tabsWrap = document.getElementById(tabsId);
  tabsWrap.querySelectorAll("[data-tab]").forEach(tab=>{
    tab.addEventListener("click",()=>{
      tabsWrap.querySelectorAll("[data-tab]").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      document.querySelectorAll(`#${tab.dataset.tab}`).forEach(panel=>{
        panel.classList.add("active");
      });
      // 同じグループの他パネルを非表示
      const groupPanels = tabsWrap.parentElement.querySelectorAll("[data-panel]");
      groupPanels.forEach(p=>{
        if(p.id !== tab.dataset.tab) p.classList.remove("active");
      });
    });
  });
}

function toggleMobFilter(){
  document.getElementById("mob-filter-panel").classList.toggle("open");
}

buildFilters("pc");
buildFilters("mob");
setupTabs("pc-tabs", "[data-panel]");
setupTabs("mob-tabs", "[data-panel]");

let resizeTimer;
window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(draw,80);});
window.addEventListener("orientationchange",()=>{setTimeout(draw,300);});
draw();
